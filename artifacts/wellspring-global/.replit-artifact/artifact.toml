kind = "web"
previewPath = "/"
title = "Well Spring Global"
version = "1.0.0"
id = "artifacts/wellspring-global"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22322

[services.development]
run = "pnpm --filter @workspace/wellspring-global run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wellspring-global", "run", "build" ]
serve = "static"
publicDir = "artifacts/wellspring-global/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22322"
BASE_PATH = "/"
